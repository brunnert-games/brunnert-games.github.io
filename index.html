<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little home for games made together as a family.">
  <title>Brunnert Games</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #23334a;
      background: #f7f5ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, main, footer {
      width: min(100% - 2.5rem, 60rem);
      margin-inline: auto;
    }

    header {
      padding-block: 2rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    main {
      flex: 1;
      padding-block: clamp(3rem, 10vw, 7rem);
    }

    .eyebrow {
      color: #47634b;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 13ch;
      margin: 0.75rem 0 1.25rem;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 36rem;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    section {
      margin-top: 4rem;
      padding: 1.75rem;
      border: 1px solid #d5dfd1;
      border-radius: 1rem;
      background: #edf3e9;
    }

    h2 { margin-top: 0; }
    section p { margin-bottom: 0; line-height: 1.6; }

    footer {
      padding-block: 2rem;
      color: #536177;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>BRUNNERT GAMES</header>
  <main>
    <p class="eyebrow">Made together, for fun</p>
    <h1>Little games, big imaginations.</h1>
    <p class="intro">Welcome to our little corner of the internet, where we make games together as a family.</p>

    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Our games</h2>
      <p>We're making something fun. Check back soon to see what we've created!</p>
    </section>
  </main>
  <footer>Made with imagination by Brunnert Games.</footer>
</body>
</html>
